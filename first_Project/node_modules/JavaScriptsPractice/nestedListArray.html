<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
    <script>
    function loadArrayData(){
        var data = [
            {Category: "Electronics", 
            Products:["Iphone", "Watch", "Laptop", "Tab", "Mobile"]},
            {Category: "Footwear", 
            Products:["Nike show", "Paragron", "Bata", "local", "kolhapuri"]},
            {Category: "Fashion", 
            Products:["T-shirt", "Shirt", "Jeans", "Blazer", "sherwani"]},
            {Category: "Furniture", 
            Products:["Chair", "Table", "Cupboard", "laptop table", "Stool"]}       
        ]
        var ol = document.getElementById("orderList");

        for(var obj of data)
    {
        var outerListItem = document.createElement("li");
        outerListItem.innerHTML = obj.Category;
         ol.appendChild(outerListItem);

        var innerUnOrderList = document.createElement("ul");

        for(var prod of obj.Products)
    {
        var innerListItem = document.createElement("li");
        innerListItem.innerHTML = prod;
        innerUnOrderList.appendChild(innerListItem);
    }

    // outerListItem.appendChild(innerUnOrderList);

     ol.appendChild(innerUnOrderList);
       // ol.appendChild(outerListItem);

    }
    }
    loadArrayData();
</script>
