<!DOCTYPE html>
<html>
    <head>
        <title>Form create</title>
        <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
        <link >
        <style>
            .form{
                width:250px;
                height: 400px;
                border: 2px solid black;
                padding: 20px;
            }

            .dark-mode{
                background-color: rgb(203, 243, 243);
                color: rgb(2, 2, 54);
            }

            .light-mode{
                background-color: rgb(254, 253, 253);
                color: rgb(29, 13, 13);
            }
        </style>
        <script>
            function changeTheme(){
                var changeMode = document.getElementById("theme");
                var form = document.getElementById("frmLogin");
                console.log(changeMode.checked)
                if(changeMode.checked == true){
                    form.className = "dark-mode form";
                    document.querySelector("button").className = "btn btn-dark w-100";
                }
                else{
                    form.className = "light-mode form";
                    document.querySelector("button").className = "btn btn-success w-100"
                }
            }
        </script>
    </head>

    <body class="container-fluid m-5">
        <div class="d-flex justify-content-center align-items-center" style="height: 400px;">
            <div class="form" id="frmLogin">
                    <h3 class="text-center">Login Form</h3>
                     <hr>
                    <div class="form-switch">
                        <input type="checkbox" 
                        id="theme"
                        class="form-check-input" 
                        onchange="changeTheme()">
                        Dark Mode
                    </div>
                    <dl>
                        <dt>Username</dt>
                        <dd><input type="text" class="form-control"></dd>
                        <dt>Email</dt>
                        <dd><input type="email" class="form-control"></dd>
                        <dt>Password</dt>
                        <dd><input type="password" class="form-control"></dd>
                    </dl>
                <button class="btn btn-success w-100">Login</button>
            </div>
        </div>
    </body>
</html>
