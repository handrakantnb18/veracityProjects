<script>
    function c1()
    {
        var product = {
            Name : "",
            Price : 0,
            Qty : 0,
            Rating : {Rate:0.0, Count: 0},
            Total: function(){
                return this.Qty * this.Price;
            },
            Cities: [],
            Print: function(){
                
                document.write(`
                <h1>Product</h1>
                Name: ${this.Name} <br>
                Price: ${this.Price} <br>
                Qty: ${this.Qty} <br> 
                Total: ${this.Total()} <br> 
                Rating: ${this.Rating.Rate} <br>
                Rating Count Total: ${this.Rating.Count} <br>
                Shipping To: ${this.Cities.toString()} <br> 
                `);

            }
        }

         product.Name = "Acer Laptop";
    product.Price = 150000.50;
    product.Qty = 3;
    product.Rating.Rate = 4.5;
    product.Rating.Count = 4500;
    product.Total();
    product.Cities = ["Bhekrai Nagar", "Hadapsar", "Pune"];
    product.Print();
    }
    c1();

   
</script>
