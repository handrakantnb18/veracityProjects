<!DOCTYPE html>
<html>
<head>
    <title>Product Api</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function loadData()
    {
        loadCategories();
      var url =  loadProducts("https://fakestoreapi.com/products");
       // var url = loadProducts(`https://fakestoreapi.com/products/category/${selectValue}`);

    }

    function loadCategories()
    {
         var select = document.getElementById("lstCategories");

        fetch("https://fakestoreapi.com/products/categories")
        .then(function(response){
            return response.json();
        })
        .then(function(categories){
            categories.unshift("All");
            for(let category of categories) {
                var option = document.createElement("option");
                option.text = category.toUpperCase();
                option.value = category;
                select.appendChild(option);

                
            }
        })
    }

    function loadProducts(url)
    {
       // fetch("https://fakestoreapi.com/products")
       fetch(url) 
       .then(function(res){
            return res.json();
        })
        .then(function(products){
            document.getElementById("product-container").innerHTML = "";
            for(let product of products){
                var div = document.createElement("div");
                div.className = "card m-2 p-2";
                div.style.width = "200px";
                div.innerHTML = `

                <div class="card-header">
                        ${product.title}
                </div>
                
                <div class="card-body">
                    <img src="${product.image}" class="w-100" height="200">    
                      <p>$${product.price}</p>
                    <p>
                        Rating: ${product.rating.rate}
                    </p>    
                
                </div>
                <div class="card-footer">
                    <button class="btn btn-danger w-100"
                        onclick="addToCartClick(${product.id})">
                        <span class="bi bi-cart4"></span>
                        Add to Cart
                    </button>  
                </div>

                `;
                document.getElementById("product-container").appendChild(div);
            }
            
        });
    }

    var cartItems = [];
    var count = 0;

    function addToCartClick(id){
        fetch(`https://fakestoreapi.com/products/${id}`)
        .then(function(res){
            return res.json();
        })
        .then(function(productObject){
            console.log("Product Details : "+ productObject.id + productObject.title)
            cartItems.push(productObject);
            getCartItemCount();
        })
    }

    function getCartItemCount(){
        count = cartItems.length;
        document.getElementById("cartCount").innerHTML = count;
    }

function changeCategory(){
    var selectValue = document.getElementById("lstCategories").value;
    console.log(selectValue);
    if(selectValue == "All"){
        loadProducts("https://fakestoreapi.com/products")
    }
    else{
        loadProducts(`https://fakestoreapi.com/products/category/${selectValue}`)
    }
}


function showCartItem(){

    var tbody = document.querySelector("tbody");
    tbody.innerHTML = "";

    for(let product of cartItems){

        var tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${product.title}</td>
            <td>${product.price}</td>
            <td>
                <img src="${product.image}" width="70" height="70">
            </td>
            <td>
                <button class="btn btn-danger btn-sm"
                         onclick="deleteProduct(${product.id})">
                    <span class="bi bi-trash"></span>
                </button>
            </td>
            <td>
                <button class="btn btn-success btn-sm"
                        onclick="editProduct(${product.id})">
                    <span class="bi bi-pencil-fill"></span>
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    }

}

<body class="container-fluid mt-2" onload="loadData()">
    <header class="bg-primary text-center p-2 text-white">
        <h1>Amazon Shoping</h1>
    </header>
    <div class="row">
        <div class="col-2 mt-2">
            <h4>Select Category</h4>
            <select class="form-select" id="lstCategories" onchange="changeCategory()">


            </select>
        </div>
        <div class="col-8">
            <div id="product-container" class="d-flex flex-wrap overflow-auto" style="height: 650px;">

            </div>
        </div>
        <div class="col-2 mt-2">
                <button class="btn btn-warning w-100"
                 onclick="showCartItem()" 
                 data-bs-toggle="modal" 
                 data-bs-target="#productModel">
                 <span class="bi bi-cart4"></span>
                 [ <span id="cartCount">0</span> ] 
                 Your Cart Items</button>

                <div class="modal" id="productModel">
                    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3>Your Cart item</h3>
                            </div>
                            <div class="modal-body">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Title</th>
                                            <th>Price</th>
                                            <th>Preview</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>


                                    </tbody>

                            </div>
                        </div>
                    </div>
                </div>
